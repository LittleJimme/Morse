<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chronos | Frequentieregeling</title>

  <style>
    :root {
      --asvz-brand-green: #aec814;
      --asvz-pink: #e4007f;
      --danger: #ff3b3b;
      --muted: #cbd5e1;
      --bg-0: #05070a;
      --bg-1: #070b10;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100dvh;
      width: 100vw;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      background:
        radial-gradient(1200px 750px at 50% 50%, rgba(228, 0, 127, 0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.75), rgba(7, 11, 20, 0.85));
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      padding: 35px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
      position: relative;
    }

    .header-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .kicker {
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--asvz-brand-green);
      font-size: 0.85rem;
    }

    .lore-text {
      font-size: 1.15rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .beacon-window {
      width: 100%;
      height: 240px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
      transition: 0.06s linear;
    }

    .lens {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #2b0000 0%, #05070a 75%);
    }

    .beacon-window.flash-on {
      background-color: rgba(255, 59, 59, 0.12);
    }

    .beacon-window.flash-on .lens {
      background: radial-gradient(circle, #ffffff 0%, var(--danger) 50%, #7a0000 100%);
      box-shadow:
        0 0 50px 15px rgba(255, 59, 59, 0.7),
        0 0 80px 30px rgba(255, 59, 59, 0.35);
    }

    .progress-track {
      height: 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--asvz-pink), #bc0069);
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 10, 0.5);
    }

    .start-overlay.hidden {
      display: none;
    }

    .start-button {
      height: 50px;
      padding: 0 20px;
      border-radius: 999px;
      border: none;
      font-weight: 800;
      background: var(--asvz-brand-green);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="header-group">
      <div class="kicker">Analoog Data-Signaal</div>
      <p class="lore-text">
        De tijdmachine stuurt in 2036 nog steeds oude failsafe-signalen.
      </p>
    </div>

    <div id="beacon" class="beacon-window">
      <div class="lens"></div>
    </div>

    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-button">Start signaal</button>
    </div>

  </div>

  <script>
    const beacon = document.getElementById("beacon");
    const progressBar = document.getElementById("progressBar");
    const overlay = document.getElementById("overlay");
    const btn = document.getElementById("startBtn");

    const UNIT = 220;
    const START_DELAY = 1800;

    const sequence = [
      1,1,4,7,
      4,1,1,1,4,1,1,7,
      1,1,1,1,1,1,1,7,
      4,6
    ];

    let audioCtx;
    let sequenceIndex = 0;

    function beep(duration) {
      if (!audioCtx || audioCtx.state !== "running") return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.value = 700;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      gain.gain.value = 0.2;

      osc.start();
      osc.stop(audioCtx.currentTime + duration / 1000);
    }

    function runLoop() {
      if (sequenceIndex >= sequence.length) {
        sequenceIndex = 0;
        resetProgress();
      }

      const isOn = sequenceIndex % 2 === 0;
      const duration = sequence[sequenceIndex] * UNIT;

      beacon.classList.toggle("flash-on", isOn);

      if (isOn) beep(duration);

      sequenceIndex++;
      setTimeout(runLoop, duration);
    }

    function resetProgress() {
      const total = sequence.reduce((a,b)=>a+b,0) * UNIT;
      progressBar.style.transition = "none";
      progressBar.style.width = "0%";
      void progressBar.offsetWidth;
      progressBar.style.transition = `width ${total}ms linear`;
      progressBar.style.width = "100%";
    }

    async function start() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      overlay.classList.add("hidden");

      setTimeout(() => {
        resetProgress();
        runLoop();
      }, START_DELAY);
    }

    btn.addEventListener("click", start);
  </script>

</body>
</html>
